<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e07b4f"/>
      <stop offset="1" stop-color="#c8552d"/>
    </linearGradient>
  </defs>

  <!-- Orbit rings -->
  <g fill="none" stroke="#f6f4ee" stroke-opacity="0.65" stroke-width="8">
    <ellipse cx="256" cy="256" rx="168" ry="68" transform="rotate(-28 256 256)"/>
    <ellipse cx="256" cy="256" rx="168" ry="68" transform="rotate(28 256 256)"/>
  </g>

  <!-- Core dot -->
  <circle cx="256" cy="256" r="46" fill="url(#core)"/>

  <!-- Traveling particles -->
  <circle cx="401" cy="197" r="15" fill="#f6f4ee"/>
  <circle cx="111" cy="315" r="15" fill="#f6f4ee"/>
</svg>
